<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A simple task manager to capture and keep track of your tasks."
    />
    <title>Task Manager</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #20243a;
        background: #f5f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 64px 20px;
        background:
          radial-gradient(ellipse at 50% 0%, #e8eaff 0, transparent 48%),
          #f5f6fb;
      }

      main {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #6258d9;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 2.7rem);
        letter-spacing: -0.055em;
      }

      .intro {
        margin: 10px 0 30px;
        color: #71758a;
        line-height: 1.6;
      }

      .task-card {
        overflow: hidden;
        border: 1px solid #e8e9f1;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(34 38 73 / 8%);
      }

      form {
        display: flex;
        gap: 10px;
        padding: 18px;
        border-bottom: 1px solid #eff0f5;
      }

      input {
        width: 100%;
        min-width: 0;
        padding: 12px 14px;
        border: 1px solid #e2e4ed;
        border-radius: 10px;
        outline: none;
        color: inherit;
        font: inherit;
        transition: border-color 150ms, box-shadow 150ms;
      }

      input::placeholder {
        color: #a0a3b2;
      }

      input:focus {
        border-color: #766cf0;
        box-shadow: 0 0 0 3px rgb(118 108 240 / 15%);
      }

      button {
        flex: 0 0 auto;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #655bdf;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background 150ms, transform 150ms;
      }

      button:hover {
        background: #5147c8;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #bcb7ff;
        outline-offset: 3px;
      }

      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 20px 10px;
      }

      h2 {
        margin: 0;
        font-size: 0.95rem;
      }

      #task-count {
        color: #85899c;
        font-size: 0.8rem;
      }

      #task-list {
        margin: 0;
        padding: 0 20px 12px;
        list-style: none;
      }

      #task-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        border-top: 1px solid #f0f1f5;
        overflow-wrap: anywhere;
      }

      .task-marker {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #8c83f2;
      }

      #empty-state {
        padding: 24px 20px 30px;
        color: #85899c;
        text-align: center;
        font-size: 0.9rem;
      }

      @media (max-width: 420px) {
        body {
          padding: 42px 16px;
        }

        form {
          gap: 8px;
          padding: 14px;
        }

        button {
          padding: 0 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little more focus</p>
      <h1>Your tasks</h1>
      <p class="intro">Get it out of your head and onto your list.</p>

      <section class="task-card" aria-label="Task manager">
        <form id="task-form">
          <label for="task-input" hidden>Add a task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What needs to get done?"
            maxlength="200"
            autocomplete="off"
            required
          />
          <button type="submit">Add task</button>
        </form>

        <div class="list-header">
          <h2>Task list</h2>
          <span id="task-count" aria-live="polite"></span>
        </div>
        <ul id="task-list" aria-label="Tasks"></ul>
        <p id="empty-state">No tasks yet. Add one to get started.</p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const taskList = document.querySelector("#task-list");
      const emptyState = document.querySelector("#empty-state");
      const taskCount = document.querySelector("#task-count");

      function renderTasks(tasks) {
        taskList.replaceChildren();

        for (const task of tasks) {
          const item = document.createElement("li");
          const marker = document.createElement("span");
          const text = document.createElement("span");

          marker.className = "task-marker";
          marker.setAttribute("aria-hidden", "true");
          text.textContent = task;
          item.append(marker, text);
          taskList.append(item);
        }

        emptyState.hidden = tasks.length > 0;
        taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      }

      function loadTasks() {
        try {
          const savedTasks = localStorage.getItem("task-manager-tasks");
          if (savedTasks === null) return [];

          const tasks = JSON.parse(savedTasks);
          return Array.isArray(tasks)
            ? tasks.filter((task) => typeof task === "string")
            : [];
        } catch (error) {
          console.error("Could not load saved tasks.", error);
          return [];
        }
      }

      let tasks = loadTasks();
      renderTasks(tasks);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const task = input.value.trim();
        if (!task) {
          input.focus();
          return;
        }

        tasks = [...tasks, task];
        try {
          localStorage.setItem("task-manager-tasks", JSON.stringify(tasks));
        } catch (error) {
          console.error("Could not save tasks.", error);
        }

        renderTasks(tasks);
        form.reset();
        input.focus();
      });
    </script>
  </body>
</html>
